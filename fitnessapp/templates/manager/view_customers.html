{% extends './base.html' %}

{% block title %}
    All Customers - Fitness Club
{% endblock %}

{% block content %}
    <div class="container mb-4">
        <h1>All Customers</h1>

        <table class="table table-striped">
            <thead class="thead-dark">
                <tr>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone Number</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                {% for customer in customers %}
                <tr>
                    <td>{{ customer.name }}</td>
                    <td>{{ customer.email }}</td>
                    <td>{{ customer.phone_number }}</td>
                    <td>
                        <a href="{% url 'edit_customer' customer.customer_id %}" class="btn btn-primary">Edit</a>
                        <a href="{% url 'delete_customer' customer.customer_id %}" class="btn btn-danger">Delete</a>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
{% endblock %}
